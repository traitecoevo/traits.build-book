on:
  push:
    branches: master
  pull_request:

name: render

## A PR only renders; the deploy step below is already guarded so it never
## publishes from a pull request. Superseded runs on the same ref are cancelled,
## since a full render executes the R in every chapter.
concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest

    permissions:
      contents: write       # gh-pages deploy, and the PR preview subdirectory
      pull-requests: write  # the preview action comments the URL on the PR

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_REMOTES_NO_ERRORS_FROM_WARNINGS: false

    steps:
      - uses: actions/checkout@v5
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install libglpk-dev libglpk40 libmbedtls-dev

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck, any::remotes, local::.
          needs: check

      - name: Cache results
        uses: actions/cache@v6
        with:
          path: |
            _book
            _freeze
          key: book-render-${{ hashFiles('**/*qmd') }}
          restore-keys: book-render-

      - name: Render
        run: quarto render

      # Lets a reviewer check the built book without a local toolchain — this
      # book needs traits.build, austraits, APCalign, galah and sf to render.
      - name: Upload the built book
        uses: actions/upload-artifact@v7
        with:
          name: book-html
          path: _book
          if-no-files-found: error
          retention-days: 14

      - name: Deploy to GitHub pages
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          # clean: false left every deleted or renamed page published forever —
          # gh-pages had 49 top-level .html against 38 real chapters, three of
          # them chapters removed long ago. clean-exclude is required, not
          # optional: without it this would delete the pr-preview/ tree and
          # break the per-PR previews.
          clean: true
          clean-exclude: |
            pr-preview
          branch: gh-pages
          folder: _book

      # Publishes this PR's build to gh-pages under pr-preview/pr-<n>/ and
      # comments the URL. Confined to umbrella-dir, so it never writes the root
      # that serves the live site; the deploy above uses clean: false, so it
      # leaves the preview directories alone in return. Torn down on close by
      # pr-preview-cleanup.yaml.
      #
      # A PR from a fork gets a read-only token and so gets no preview. That is
      # accepted rather than worked around: the alternative is
      # pull_request_target, which would run this workflow at the base ref with
      # write access to gh-pages.
      - name: Deploy PR preview
        if: github.event_name == 'pull_request'
        uses: rossjrw/pr-preview-action@v1.8.1
        with:
          source-dir: _book
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          action: deploy
