on:
  push:
    branches: master
  pull_request:

name: render

## A PR only renders; the deploy step below is already guarded so it never
## publishes from a pull request. Superseded runs on the same ref are cancelled,
## since a full render executes the R in every chapter.
concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_REMOTES_NO_ERRORS_FROM_WARNINGS: false

    steps:
      - uses: actions/checkout@v5
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install libglpk-dev libglpk40 libmbedtls-dev

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck, any::remotes, local::.
          needs: check

      - name: Cache results
        uses: actions/cache@v6
        with:
          path: |
            _book
            _freeze
          key: book-render-${{ hashFiles('**/*qmd') }}
          restore-keys: book-render-

      - name: Render
        run: quarto render

      # Lets a reviewer check the built book without a local toolchain — this
      # book needs traits.build, austraits, APCalign, galah and sf to render.
      - name: Upload the built book
        uses: actions/upload-artifact@v7
        with:
          name: book-html
          path: _book
          if-no-files-found: error
          retention-days: 14

      - name: Deploy to GitHub pages
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          clean: false
          branch: gh-pages
          folder: _book
