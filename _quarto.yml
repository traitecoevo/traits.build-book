project:
  type: book
  ## Chapters live in content/ but their code reads data/ and config/ relative
  ## to the project root. Without this each .qmd executes in its own directory
  ## and all 34 of those paths break.
  execute-dir: project

## Project-level so it also covers content/. A root _metadata.yml does not
## reach chapters in a subdirectory, so freeze silently stopped caching
## after the move and every render re-executed every chapter.
execute:
  freeze: auto

book:
  title: "The {traits.build} data model, R package, and workflow"
  author: "Elizabeth Wenk, Sophie Yang, Fonti Kar, Daniel Falster\n\nEvolution and Ecology Research Centre, \n\nThe University of New South Wales Sydney, NSW 2052\n\nAustralia"
  page-footer: "How to get help: <https://traitecoevo.github.io/traits.build-book/content/help.html><br>Source and issues: <https://github.com/traitecoevo/traits.build-book><br>Copyright 2023, Daniel Falster and Elizabeth Wenk"
  page-navigation: true

  ## Puts "Edit this page", "Report an issue" and "View source" on every page,
  ## each deep-linked to that chapter's .qmd. repo-actions needs repo-url, and
  ## repo-branch must name the default branch or the edit links 404.
  site-url: https://traitecoevo.github.io/traits.build-book/
  repo-url: https://github.com/traitecoevo/traits.build-book
  repo-branch: master
  repo-actions: [edit, issue, source]
  chapters:
    - part: Introduction
      chapters:
        - index.qmd
        - content/installation.qmd
        - content/motivation.qmd
        - content/workflow.qmd
        - content/usage_examples.qmd
    - part: Data structure and standard
      chapters:
        - content/long_wide.qmd
        - content/database_standard.qmd
        - content/database_structure.qmd
        - content/database_metadata.qmd
        - content/dictionary.qmd
    - part: Creating with `traits.build`
      chapters:
        - content/traits_build.qmd
        - content/tutorial_compilation.qmd
        - content/file_organisation.qmd
        - content/create_dictionary.qmd
        - content/adding_data_brief.qmd
        - content/publishing.qmd
    - part: "Guide to adding data"
      chapters:
        - content/tutorial_datasets.qmd
        - content/tutorial_dataset_1.qmd
        - content/tutorial_dataset_2.qmd
        - content/tutorial_dataset_3.qmd
        - content/tutorial_dataset_4.qmd
        - content/tutorial_dataset_5.qmd
        - content/tutorial_dataset_6.qmd
        - content/tutorial_dataset_7.qmd
        - content/adding_data_long.qmd
        - content/check_dataset_functions.qmd
        - content/data_common_issues.qmd
        - content/github.qmd
        - content/versioned_releases.qmd
    - part: Using outputs of `traits.build`
      chapters:
        - content/austraits_database.qmd
        - content/AusTraits_tutorial.qmd
        - content/traits_and_climate_example.qmd
        - content/spatial_data_example.qmd
        - content/austraits_package.qmd
    - part: Getting help
      chapters:
        - content/help.qmd

  appendices:
    - content/glossary.qmd
    - content/csv.qmd
    - content/yaml.qmd

